name: seafood-provenance-backend

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seafood-provenance-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - chain
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules

  chain:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seafood-provenance-chain
    restart: unless-stopped
    command: npx hardhat node --hostname 0.0.0.0
    working_dir: /app
    expose:
      - "8545"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules

volumes:
  backend_node_modules:
